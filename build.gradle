plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = mod_version
group = 'com.valorcraft.vauction'

base {
    archivesName = 'VAuction-1.20.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
}

minecraft {
    mappings channel: 'official', version: "${minecraft_version}"

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                vauction {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                vauction {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
    // VEconomy собирается из соседнего проекта; jar кладётся в libs/ как
    // veconomy-1.0.0.jar (compile-only, в финальный jar не попадает).
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // VEconomy: полная сборка невозможна без локальных зависимостей (kubejs и пр.),
    // поэтому на compile classpath ложится API-снимок HEAD (b3e41fa) + компиляционный
    // stub EconomyCore — signalатуры совпадают с реальным economy_core.jar,
    // который подставляется на сервере (mods/). В финальный jar не попадает.
    compileOnly files('libs/veconomy-api-1.0.0.jar')
    runtimeOnly files('libs/veconomy-api-1.0.0.jar')

    // Собственная БД VAuction: SQLite (по умолчанию). Драйвер упаковывается jarJar'ом.
    implementation('org.xerial:sqlite-jdbc:3.45.3.0') { transitive = false }
    jarJar('org.xerial:sqlite-jdbc:3.45.3.0') {
        jarJar.ranged(it, '[3.45.3.0,4.0.0)')
    }

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "failed", "skipped"
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest {
        attributes([
                'Specification-Title'   : 'VAuction',
                'Specification-Version' : project.version,
                'Specification-Vendor'  : 'ValorCraft',
                'Implementation-Title'  : 'VAuction',
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor': 'ValorCraft'
        ])
    }
}